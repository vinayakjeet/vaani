# Render free tier. The service spins down when idle, so the first request after
# a quiet period pays a cold start. That is accepted and documented rather than
# engineered around: the first session is flagged so it can be excluded from the
# latency statistics instead of quietly inflating them (SPEC A9).
services:
  - type: web
    name: vaani
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Call the interpreter the build produced rather than going through `uv run`.
    # `uv run` re-resolves and syncs before executing, which on a cold container
    # blows past Render's port-scan window, and it assumes uv is on the runtime
    # PATH, which is not guaranteed just because the build step installed it.
    # ShipGate lost a deploy to exactly this.
    startCommand: .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ENVIRONMENT
        value: production
      # Set in the Render dashboard, never committed.
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
