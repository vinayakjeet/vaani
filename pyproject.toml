[project]
name = "vaani"
version = "0.1.0"
description = "Real-time Hindi and Hinglish voice agent: streamed VAD, STT, LLM and TTS with barge-in."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    # No opentelemetry here. Nothing in this repo imports it: Spanlight declares
    # the SDK and the OTLP exporter it needs, and the FastAPI instrumentation the
    # chassis listed was imported nowhere at all.
    "spanlight",
    "edge-tts>=6.1",
    "websockets>=13.0",
]

# Spanlight is instrumented from the first commit rather than retrofitted, which
# was the condition on building this project before Tollgate and Dastavez.
[tool.uv.sources]
spanlight = { git = "https://github.com/vinayakjeet/spanlight" }

# The two optional ablation arms: Silero for "is this speech", smart-turn for "has this
# turn ended". Optional because the energy detector and the word-order rule are the
# baseline arms the ablation measures against, so the free stack has to run without these.
# The model files themselves are fetched by scripts/fetch_models.py, not declared here.
[project.optional-dependencies]
models = [
    "onnxruntime>=1.20",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # numpy in dev, not only in the extra, so the mel filterbank check against OpenAI's
    # published reference runs in CI. It needs no model file, and it is the one part of
    # the smart-turn arm that can be wrong while every other test stays green.
    "numpy>=2.0",
    "miniaudio>=1.71",
    # The second waterfall column (M4.4) only, never the deployed free stack: Sarvam
    # is a credit-limited comparison arm bench/waterfall.py runs on demand, not a
    # provider app/routers/voice.py depends on. The vendor's own SDK rather than a
    # hand-rolled client, because the streaming STT socket's exact wire framing is
    # not fully documented publicly and a framing mistake against a 100-credit
    # balance is not a mistake worth making twice.
    "sarvamai>=0.1.30",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
