[project]
name = "vaani"
version = "0.1.0"
description = "Real-time Hindi and Hinglish voice agent: streamed VAD, STT, LLM and TTS with barge-in."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    # No opentelemetry here. Nothing in this repo imports it: Spanlight declares
    # the SDK and the OTLP exporter it needs, and the FastAPI instrumentation the
    # chassis listed was imported nowhere at all.
    "spanlight",
    "edge-tts>=6.1",
    "websockets>=13.0",
]

# Spanlight is instrumented from the first commit rather than retrofitted, which
# was the condition on building this project before Tollgate and Dastavez.
[tool.uv.sources]
spanlight = { git = "https://github.com/vinayakjeet/spanlight" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
